name: Pull-Request-CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  Build-and-Test-LinuxOsX:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
       os: [ubuntu-latest, macos-15-intel]
       python-version: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac
        with:
          submodules: recursive
      - uses: conda-incubator/setup-miniconda@2defc80cc6f4028b1780c50faf08dd505d698976
        with:
          miniconda-version: "latest"
          activate-environment: usgscsm
          environment-file: environment.yml
          auto-activate-base: false
          auto-update-conda: true
          python-version: ${{ matrix.python-version }}
      - name: Check build environment
        run: |
          conda list
      - name: Build Package
        run: |
          mkdir -p build
          cd build
          cmake -DCMAKE_BUILD_TYPE=RELEASE -DUSGSCSM_EXTERNAL_DEPS=OFF -DUSGSCSM_BUILD_DOCS=OFF ..
          cmake --build . -j3
      - name: Test Package
        run: |
          cd build
          ctest --output-on-failure 
  
  Build-and-Test-Win:
    runs-on: windows-2022
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: conda-incubator/setup-miniconda@2defc80cc6f4028b1780c50faf08dd505d698976
        with:
          miniconda-version: "latest"
          activate-environment: usgscsm
          environment-file: environment.yml
          auto-activate-base: false
          auto-update-conda: true
          python-version: ${{ matrix.python-version }}
      - name: Check build environment
        run: |
          conda list
      - name: Build Package
        run: |
          mkdir -p build
          cd build
          cmake -G "Visual Studio 17 2022" -DUSGSCSM_BUILD_DOCS=OFF -DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=ON ..
          cmake --build . --target ALL_BUILD --config Release
      - name: Test Package
        run: |
          cd build
          ctest -C Release --output-on-failure

      # Second variant: csmapi linked in statically, so the DLL stands alone. Separate
      # build tree because USGSCSM_STATIC_CSM switches the whole configuration.
      - name: Build static-CSM variant
        if: matrix.python-version == '3.13'
        run: |
          mkdir -p build-static
          cd build-static
          cmake -G "Visual Studio 17 2022" -DUSGSCSM_BUILD_DOCS=OFF -DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=ON -DUSGSCSM_STATIC_CSM=ON -DUSGSCSM_BUILD_TESTS=OFF ..
          cmake --build . --target ALL_BUILD --config Release

      - uses: actions/upload-artifact@c7d193f32edcb7bfad88892161225aeda64e9392
        with:
          name: usgscsm_py${{ matrix.python-version }}
          path: |
            build/Release/usgscsm.dll
            build/Release/usgscsm_cam_test.exe

      - name: Stage Windows dev bundle
        if: matrix.python-version == '3.13'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dev-bundle | Out-Null

          # Locate csmapi.dll from the import library the build actually linked against,
          # rather than guessing at the conda prefix layout.
          $csmLib = (Select-String -Path build\CMakeCache.txt -Pattern '^CSM_LIBRARY:FILEPATH=' |
                     Select-Object -First 1).Line -replace '^CSM_LIBRARY:FILEPATH=', ''
          if (-not $csmLib) { throw "CSM_LIBRARY not found in build\CMakeCache.txt" }
          $csmDll = Join-Path (Split-Path (Split-Path $csmLib -Parent) -Parent) 'bin\csmapi.dll'
          Write-Host "csmapi import library: $csmLib"
          Write-Host "csmapi runtime library: $csmDll"

          foreach ($f in @('build\Release\usgscsm.dll', $csmDll,
                           'build-static\Release\usgscsmstatic.dll')) {
            if (-not (Test-Path $f)) { throw "Missing expected bundle file: $f" }
            Copy-Item $f dev-bundle\
          }

          @(
            "commit:    ${{ github.sha }}",
            "run:       ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "generator: Visual Studio 17 2022 (Release, x64)",
            "csmapi:    $csmDll",
            "usgscsm.dll:       shared csmapi, registers with the host's registry",
            "usgscsmstatic.dll: csmapi linked in, private registry, no csmapi.dll needed"
          ) | Set-Content dev-bundle\BUILDINFO.txt

          Get-ChildItem dev-bundle | Format-Table Name, Length

      # usgscsm.dll should import csmapi.dll plus system DLLs only; anything else
      # (ale.dll, proj*.dll, sqlite3.dll) is a dependency that failed to embed. The static
      # variant must not import csmapi.dll at all -- that is the whole point of it.
      - name: Check DLL imports
        if: matrix.python-version == '3.13'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { Write-Host "vswhere not found; skipping"; exit 0 }
          $dumpbin = & $vswhere -latest -find '**\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          if (-not $dumpbin) { Write-Host "dumpbin not found; skipping"; exit 0 }

          & $dumpbin /dependents dev-bundle\usgscsm.dll

          $deps = & $dumpbin /dependents dev-bundle\usgscsmstatic.dll
          $deps
          if ($deps -match 'csmapi\.dll') {
            throw "usgscsmstatic.dll imports csmapi.dll; the static link did not take"
          }

      - uses: actions/upload-artifact@c7d193f32edcb7bfad88892161225aeda64e9392
        if: matrix.python-version == '3.13'
        with:
          name: usgscsm-dev-win64
          path: dev-bundle/

  Publish-Dev-DLLs:
    needs: Build-and-Test-Win
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: dev-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: usgscsm-dev-win64
          path: dev-bundle

      - name: Bundle as zip
        run: zip -j usgscsm-dev-win64.zip dev-bundle/*

      # Delete and recreate rather than update: `--target` re-points the `dev` tag at this
      # commit, whereas updating an existing release would leave the tag on the old one and
      # misreport which source the binaries came from.
      # GH_REPO because this job has no checkout for gh to infer the repo from.
      - name: Refresh dev prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<EOF
          Unsigned Windows x64 development build of main at ${GITHUB_SHA:0:8}. Two variants,
          differing only in how the CSM API is linked. Both are runtime-loaded plugins, so
          no import libraries are shipped.

          **usgscsm.dll** — needs **csmapi.dll** next to it (or elsewhere on the DLL search
          path). Use this with a host that has its own csmapi, such as ISIS or ASP: the
          plugin registers into the host's csm::Plugin registry because both sides share
          one csmapi. csmapi is the only dependency that is not statically embedded.

          **usgscsmstatic.dll** — self-contained, needs no csmapi.dll, and re-exports the
          CSM API itself. Use this where csmapi.dll cannot be supplied. It carries a private
          csm::Plugin registry, so it will *not* show up in the registry of a host that
          links its own csmapi; reach the models through this DLL's own exports.

          Replaced on every push to main. Built by
          ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF

          gh release delete dev --yes --cleanup-tag || true
          gh release create dev \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Development build (main)" \
            --notes-file notes.md \
            usgscsm-dev-win64.zip \
            dev-bundle/usgscsm.dll \
            dev-bundle/csmapi.dll \
            dev-bundle/usgscsmstatic.dll

  Build-Docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac
        with:
          submodules: true
          fetch-depth: 0
      - uses: conda-incubator/setup-miniconda@2defc80cc6f4028b1780c50faf08dd505d698976
        with:
          miniconda-version: "latest"
          activate-environment: usgscsm
          environment-file: doc_environment.yml
          auto-activate-base: false
          auto-update-conda: true

      - name: Check doc build environment
        run: |
          conda list

      - name: Build Docs
        run: |
          cd docs
          doxygen Doxyfile.in
          sphinx-build -b html source public
